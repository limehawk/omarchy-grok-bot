name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin
        run: |
          command -v jq >/dev/null || (apt-get update -qq && apt-get install -y -qq jq)
          bash scripts/validate.sh .
