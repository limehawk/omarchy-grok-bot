name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          bash scripts/validate.sh .
